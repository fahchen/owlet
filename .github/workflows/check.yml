name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The newest Xcode on the image, so swift-format and the SDK match what developers build with.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun swift-format --version
      # Keyboard navigation on, as on a developer Mac: with it off, Tab skips buttons, and the panel
      # traversal test has only buttons to reach.
      - name: Turn on keyboard navigation
        run: defaults write -g AppleKeyboardUIMode -int 2
      - uses: jdx/mise-action@v2
      - run: mise run check
