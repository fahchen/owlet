<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const samples={en:{text:"Let's take a step back and look at the bigger picture before we move forward.",zh:'在继续推进之前，让我们先退一步，从全局的角度看一看。',ja:'先に進む前に、一歩引いて全体像を見てみましょう。',polish:"Before moving forward, let's take a step back and consider the bigger picture.",language:'英语',code:'EN',learn:[['take a step back','退一步重新审视，常用于讨论需要换个角度时。'],['the bigger picture','全局、整体情况。强调超越眼前的细节。'],['move forward','继续推进，可用于项目进展或决策。']]},ja:{text:'お手数ですが、明日までにご確認いただけますと幸いです。',zh:'麻烦您在明天之前确认一下，不胜感激。',ja:'お手数ですが、明日までにご確認いただけますと幸いです。',polish:'お手数をおかけしますが、明日までにご確認いただけますと幸いです。',language:'日语',code:'JA',learn:[['お手数ですが','麻烦您了，用于提出请求时的礼貌铺垫。'],['いただけますと幸いです','如果您能……将不胜感激，适合工作沟通。']]}};
let saved;try{saved=JSON.parse(localStorage.getItem('owlet-design-v1')||'null')}catch{}
let book=saved?.book||[{id:1,text:'take a step back',meaning:'退一步，从新的角度重新审视。',lang:'英语',code:'EN',contexts:[samples.en.text]},{id:2,text:'お手数ですが',meaning:'麻烦您了。用于礼貌地提出请求。',lang:'日语',code:'JA',contexts:[samples.ja.text]},{id:3,text:'the bigger picture',meaning:'全局，整体情况。',lang:'英语',code:'EN',contexts:[samples.en.text]}],history=saved?.history||[{id:4,type:'translate',source:samples.en.text,result:samples.en.zh,lang:'英语',code:'EN',time:'今天 09:41'},{id:5,type:'polish',source:samples.ja.text,result:samples.ja.polish,lang:'日语',code:'JA',time:'今天 09:28'}],prefs={target:'zh',translate:false,polish:false,...saved?.prefs};

function persist(){try{localStorage.setItem('owlet-design-v1',JSON.stringify({book,history,prefs}))}catch{toast('浏览器存储不可用，本次内容仅保留到关闭页面')}}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2800)}

function translated(){return prefs.target==='en'?samples[which].text:samples[which][prefs.target]||samples[which].zh}
function sample(k){which=k;navigate(view==='polish'?'polish':'translate')}
function title(){return {translate:'翻译',polish:'润色',direct:'翻译并替换',book:'生词本',history:'历史记录',settings:'设置'}[view]}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#bookcount').textContent=book.length;$('#main').innerHTML=`<header class="titlebar"><h1>${detail?title()+' / 详情':title()}</h1><span class="meta">${icon(view==='history'?'clock':'spark')}${['translate','polish','direct'].includes(view)?'示例预览':view==='book'?book.length+' 个表达':view==='settings'?'按你的习惯':'仅本地保存'}</span></header><div class="body" id="body">${detail?detailHTML():['translate','polish','direct'].includes(view)?editorHTML():view==='settings'?settingsHTML():listHTML()}</div>${footerHTML()}`;bind();}
function editorHTML(){const s=samples[which];return `<section class="source-section"><div class="labelrow"><span class="label">${icon('translate')} ${s.language} · 自动识别</span><span>原文</span></div><textarea id="input" class="source" aria-label="原文" spellcheck="false">${esc(input)}</textarea></section><section class="result-section"><div class="labelrow"><span class="label">${view==='polish'?'润色结果':'译文'}</span>${view==='polish'?'<span>保留原意 · 自然表达</span>':`<select class="lang" id="target" aria-label="目标语言"><option value="zh" ${prefs.target==='zh'?'selected':''}>简体中文</option><option value="ja" ${prefs.target==='ja'?'selected':''}>日本語</option><option value="en" ${prefs.target==='en'?'selected':''}>English</option></select>`}</div><div id="result" class="result ${view==='polish'?'english':''} ${busy?'working':''}" aria-live="polite">${esc(result)}</div><div class="under-result"><button class="subtle" id="saveSelection">${icon('book')} 收藏选中内容</button>${view==='polish'?'<button class="subtle" onclick="showDiff()">查看修改对照</button>':''}<span class="muted" style="font-size:10px;margin-left:auto">可选中词语或整句</span></div></section>${notice?`<div class="status ${noticeError?'error':''}" role="status">${esc(notice)}</div>`:''}<section class="learning"><button class="disclose" id="expand" aria-expanded="${expanded}"><span>${icon('spark')} 值得学习的表达 ${expanded?'':`<small>按需展开</small>`}</span><span>${expanded?'收起':'展开'} ${icon('chevron')}</span></button>${expanded?`<div>${s.learn.map(([t,m],i)=>`<label class="learning-row"><input type="checkbox" name="learn" value="${i}"><div><strong>${esc(t)}</strong><span class="badge">${i===0?'搭配':'表达'}</span><p>${esc(m)}</p></div></label>`).join('')}<div class="learning-actions"><button class="secondary" id="collectLearn" disabled>收藏所选 <span id="selectedCount">0</span></button></div></div>`:''}</section>`}
function footerHTML(){if(detail)return `<footer class="footer"><button class="subtle" onclick="detail=null;render()">← 返回列表</button><div class="actions"><button class="secondary" onclick="copyText(detail.result||detail.text)">${icon('copy')} 复制</button>${view==='book'?'<button class="primary" onclick="saveEdit()">保存修改</button>':'<button class="primary" onclick="collect(detail.result,\'\',detail)">收藏整句</button>'}</div></footer>`;if(['translate','polish','direct'].includes(view))return `<footer class="footer"><small>${busy?'正在处理示例…':'Esc 关闭'} ${busy?'':'<kbd>⌥ T</kbd> 翻译'}</small><div class="actions">${busy?'<button class="secondary" onclick="cancel()">取消</button>':`<button class="secondary" onclick="run(${view==='direct'})">${view==='direct'?'再次翻译并替换':'重新'+(view==='polish'?'润色':'翻译')}</button><button class="secondary" onclick="copyText(result)">${icon('copy')} 复制</button><button class="primary" onclick="replace()">替换原选区 <kbd>⌘ ↵</kbd></button>`}</div></footer>`;if(view==='settings')return '<footer class="footer"><small>原型不发送请求，也不保存 API Key</small><button class="primary" onclick="saveSettings()">保存设置</button></footer>';return `<footer class="footer"><small>${view==='book'?'从遇见，到积累。':'保留每一次表达。'}</small>${view==='book'?'<button class="secondary" onclick="exportBook()">导出生词本 ↗</button>':'<button class="subtle danger" onclick="clearHistory()">清空历史</button>'}</footer>`}
function listHTML(){return `<div class="searchbar"><input id="search" aria-label="搜索" placeholder="${view==='book'?'搜索表达或释义':'搜索原文或结果'}" value="${esc(query)}"><select id="filter" aria-label="筛选"><option value="">${view==='book'?'全部语言':'全部类型'}</option>${(view==='book'?[['英语','英语'],['日语','日语']]:[['translate','翻译'],['polish','润色']]).map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select></div><div id="rows">${rowsHTML()}</div>`}
function rowsHTML(){const items=(view==='book'?book:history).filter(x=>(!filter||(view==='book'?x.lang:x.type)===filter)&&JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));return items.length?`<div class="group-title">${view==='book'?'所有表达':'最近记录'} · ${items.length}</div>`+items.map(x=>`<div class="listrow"><span class="langchip">${x.code}</span><button class="entry" data-detail="${x.id}"><strong>${esc(view==='book'?x.text:x.source)}</strong><p>${esc(view==='book'?x.meaning||x.contexts[0]:x.result)}</p></button><span class="mini">${view==='book'?x.contexts.length+' 个语境':x.type==='polish'?'润色':'翻译'}</span><button class="iconbtn" data-delete="${x.id}" aria-label="删除 ${esc(x.text||x.source)}">${icon('trash')}</button></div>`).join(''):`<div class="empty">${icon(view==='book'?'book':'clock')}<h2>${query||filter?'没有匹配的内容':view==='book'?'把有用的表达留在这里':'还没有历史记录'}</h2><p>${query||filter?'换个关键词，或清除筛选。':'从翻译或润色开始，内容会出现在这里。'}</p><button class="secondary" onclick="${query||filter?'query=filter=\'\';render()':"navigate('translate')"}">${query||filter?'清除筛选':'去翻译'}</button></div>`}
function detailHTML(){let d=detail;return `<article class="detail"><div class="labelrow"><span>${esc(d.lang)} · ${view==='book'?'收藏表达':d.type==='polish'?'润色':'翻译'}</span><span>${esc(d.time||'个人生词本')}</span></div>${view==='book'?`<h2>${esc(d.text)}</h2><label class="form-field">表达<input id="editText" value="${esc(d.text)}"></label><label class="form-field">中文释义<textarea id="editMeaning">${esc(d.meaning)}</textarea></label><div class="group-title">原句语境</div>${d.contexts.map(c=>`<div class="quote">${esc(c)}</div>`).join('')}`:`<div class="quote">${esc(d.source)}</div><h2 style="font-size:22px;line-height:1.65">${esc(d.result)}</h2><p class="muted" style="font-size:12px">历史内容可复制、收藏，不会写回原应用。</p>`}</article>`}
function settingsHTML(){return `<section class="settings-group"><div class="group-title">学习内容</div>${['translate','polish'].map(k=>`<div class="formrow"><div><strong>${k==='translate'?'翻译':'润色'}后展示学习内容</strong><p>${k==='translate'?'提取原文中的词汇、搭配与句式':'解释改进的表达，以及为什么这样写'}</p></div><button class="switch" role="switch" aria-label="${k==='translate'?'翻译':'润色'}学习内容" aria-checked="${prefs[k]}" onclick="prefs.${k}=!prefs.${k};persist();render()"></button></div>`).join('')}</section><section class="settings-group"><div class="group-title">模型服务</div><label class="form-field">Base URL<input id="base" type="url" value="${esc(prefs.base||'https://api.openai.com/v1')}" placeholder="https://…/v1"></label><label class="form-field">API Key<input id="key" type="password" autocomplete="off" placeholder="仅展示输入样式，请勿填写真实 Key"></label><label class="form-field">模型名称<input id="model" value="${esc(prefs.model||'')}" placeholder="填写服务商提供的模型名称"></label><p class="muted" style="font-size:11px;line-height:1.7">正式应用将使用 macOS 钥匙串保存 Key。此原型使用内置样例，不连接模型服务。</p></section><section><div class="group-title">快捷操作 · 原型页面内</div>${[['翻译','⌥ T'],['润色','⌥ P'],['翻译并替换','⌥ R']].map(([n,k])=>`<div class="formrow"><strong>${n}</strong><kbd>${k}</kbd></div>`).join('')}</section>`}
function bind(){if($('#input')){$('#input').oninput=e=>{input=e.target.value;generation++;busy=false;result='';$('#result').textContent='点击下方语言示例继续体验';notice='原文已修改。此原型仅内置英语与日语示例，可切换示例继续体验。';};$('#input').onselect=e=>{selectedText=e.target.value.slice(e.target.selectionStart,e.target.selectionEnd)};$('#saveSelection').onclick=()=>{if(!selectedText.trim())return toast('请先选中原文或译文中的词语，也可以选中整句');collect(selectedText,'')};$('#expand').onclick=()=>{expanded=!expanded;render()};if($('#target'))$('#target').onchange=e=>{prefs.target=e.target.value;persist();run(view==='direct')};document.querySelectorAll('[name=learn]').forEach(c=>c.onchange=()=>{const count=document.querySelectorAll('[name=learn]:checked').length;$('#selectedCount').textContent=count;$('#collectLearn').disabled=!count});if($('#collectLearn'))$('#collectLearn').onclick=()=>{document.querySelectorAll('[name=learn]:checked').forEach(c=>{const [t,m]=samples[which].learn[+c.value];collect(t,m)});render()}}if($('#search')){$('#search').oninput=e=>{query=e.target.value;$('#rows').innerHTML=rowsHTML();bindRows()};$('#filter').onchange=e=>{filter=e.target.value;$('#rows').innerHTML=rowsHTML();bindRows()};bindRows()}}
function bindRows(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{detail=(view==='book'?book:history).find(x=>x.id===+b.dataset.detail);render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(view==='book')book=book.filter(x=>x.id!==+b.dataset.delete);else history=history.filter(x=>x.id!==+b.dataset.delete);persist();render();toast('已删除')})}
function collect(text,meaning,d){const s=d||samples[which],lang=s.lang||s.language,source=s.source||input;const found=book.find(x=>x.text===text.trim()&&x.lang===lang);if(found){if(!found.contexts.includes(source))found.contexts.push(source);toast('已收藏，语境已保留')}else{book.unshift({id:Date.now()+Math.random(),text:text.trim(),meaning,lang,code:s.code,contexts:[source]});toast('已加入生词本')}persist();$('#bookcount').textContent=book.length}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('已复制')}catch{toast('浏览器限制剪贴板，请选中结果后按 ⌘C')}}
function cancel(){generation++;busy=false;notice='已取消，本次操作不会替换原文。';noticeError=false;render()}
function run(direct=false){if(input!==samples[which].text){toast('此原型使用内置样例，请点击下方英语或日语示例');return}const token=++generation;busy=true;notice='';render();setTimeout(()=>{if(token!==generation)return;busy=false;if($('#scenario').value==='error'){notice='暂时无法连接模型服务。原文未修改，可以重试。';noticeError=true;render();return}result=view==='polish'?samples[which].polish:translated();history.unshift({id:Date.now(),type:view==='polish'?'polish':'translate',source:input,result,lang:samples[which].language,code:samples[which].code,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});persist();if(direct)replace();else render()},650)}
function replace(){if(!result)return toast('请先生成结果');if($('#scenario').value==='stale'||$('#external').value!==sourceSnapshot){notice='原选区已变化，未进行替换。你仍可以复制译文。';noticeError=true}else{$('#external').value=result;notice='已替换模拟原选区。翻译结果已保留。';noticeError=false;toast('已替换原选区');$('#sourceDrawer').classList.remove('hidden')}render()}
function toggleSource(){$('#sourceDrawer').classList.toggle('hidden')}
function showDiff(){notice='原表达：'+input+'\n改写：'+result;noticeError=false;render()}
function saveEdit(){const t=$('#editText').value.trim();if(!t)return toast('表达不能为空');detail.text=t;detail.meaning=$('#editMeaning').value;persist();toast('修改已保存');render()}
function saveSettings(){const b=$('#base');if(!b.reportValidity())return;prefs.base=b.value;prefs.model=$('#model').value;$('#key').value='';persist();toast('设置已保存，API Key 未保存')}
function clearHistory(){if(!history.length)return toast('没有可清空的记录');if(confirm('清空全部历史？生词本中的收藏不会被删除。')){history=[];persist();render();toast('历史已清空，收藏仍保留')}}
function exportBook(){const url=URL.createObjectURL(new Blob([JSON.stringify(book,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='owlet-vocabulary.json';a.click();URL.revokeObjectURL(url);toast('已导出生词本')}
$('#scenario').onchange=()=>toast('已切换演示场景，重新处理文本即可体验');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(s&&s.toString().trim()&&$('#result')?.contains(s.anchorNode))selectedText=s.toString()});document.addEventListener('keydown',e=>{if(e.altKey&&['KeyT','KeyP','KeyR'].includes(e.code)){e.preventDefault();navigate({KeyT:'translate',KeyP:'polish',KeyR:'direct'}[e.code])}if(e.key==='Escape'){generation++;busy=false;$('#window').classList.add('hidden');$('#closed').classList.remove('hidden');$('#sourceDrawer').classList.add('hidden')}if(e.key==='Enter'&&e.metaKey&&['translate','polish','direct'].includes(view)){e.preventDefault();replace()}});render();
</script></body></html>
