function bind(){if($('#input')){$('#input').oninput=e=>{input=e.target.value;generation++;busy=false;result='';selectedText='';if($('#result'))$('#result').textContent='此原型使用内置样例';const f=$('.footer');f.outerHTML=quickFooter()};$('#input').onselect=e=>{selectedText=e.target.value.slice(e.target.selectionStart,e.target.selectionEnd)};if($('#saveSelection'))$('#saveSelection').onclick=()=>{if(!selectedText.trim())return toast('请先选中原文或译文中的词语，也可以选中整句');collect(selectedText,'')};if($('#expand'))$('#expand').onclick=()=>{expanded=!expanded;if(['learning-loading','learning-error','learning-empty','saved'].includes(screen))screen='result';render()};if($('#target'))$('#target').onchange=e=>{prefs.target=e.target.value;persist();run(view==='direct')};document.querySelectorAll('[name=learn]').forEach(c=>c.onchange=()=>{const count=document.querySelectorAll('[name=learn]:checked').length;$('#selectedCount').textContent=count;$('#collectLearn').disabled=!count});if($('#collectLearn'))$('#collectLearn').onclick=()=>{document.querySelectorAll('[name=learn]:checked').forEach(c=>{const [t,m]=samples[which].learn[+c.value];collect(t,m)});render()}}if($('#search')){$('#search').oninput=e=>{query=e.target.value;$('#rows').innerHTML=rowsHTML();bindRows()};$('#filter').onchange=e=>{filter=e.target.value;$('#rows').innerHTML=rowsHTML();bindRows()};bindRows()}}

function collect(text,meaning,d){const s=d||samples[which],lang=s.lang||s.language,source=s.source||input;const found=book.find(x=>x.text===text.trim()&&x.lang===lang);if(found){if(!found.contexts.includes(source))found.contexts.push(source);toast('已收藏，语境已保留')}else{book.unshift({id:Date.now()+Math.random(),text:text.trim(),meaning,lang,code:s.code,contexts:[source]});toast('已加入生词本')}persist();$('#bookcount').textContent=book.length}

 ['cancelled','请求 · 已取消','取消后的响应不再写回；可重新处理。'],

 ['book-empty','生词本 · 空状态','完整窗口管理积累，空状态不伪造收藏。'],

$('#statePicker').innerHTML=states.map(([id,name])=>`<option value="${id}">${name}</option>`).join('');
function stepState(delta){const i=states.findIndex(x=>x[0]===$('#statePicker').value);preview(states[(i+delta+states.length)%states.length][0])}
function preview(id){
 generation++;busy=false;screen=id;diffOpen=id==='diff';which='en';view=['polish','diff'].includes(id)?'polish':['direct-loading','success','stale'].includes(id)?'direct':['book-empty','no-results'].includes(id)?'book':id==='history-empty'?'history':'translate';
 input=['empty','permission','unconfigured'].includes(id)?'':samples.en.text;sourceSnapshot=input;$('#external').value=input;result=['empty','permission','unconfigured','loading','direct-loading','error','cancelled'].includes(id)?'':view==='polish'?samples.en.polish:translated();
 expanded=['learning','learning-loading','learning-error','learning-empty','saved'].includes(id);notice='';noticeError=false;detail=null;query=id==='no-results'?'no-match-example':'';filter='';selectedText='';
 if(id==='long')result=Array(5).fill(samples.en.zh+' 眼前的细节很重要，但整体方向同样值得关注。').join('\n\n');
 const messages={success:'✓ 已替换原选区，结果已保留在历史。',stale:'原选区已变化，未进行替换。请复制译文。',error:'连接暂时中断，原文未修改。请重试。',cancelled:'已取消，本次操作不会替换原文。'};
 if(messages[id]){notice=messages[id];noticeError=['stale','error'].includes(id)}
 $('#sourceDrawer').classList.add('hidden');$('#window').classList.remove('hidden');$('#closed').classList.add('hidden');$('#statePicker').value=id;const i=states.findIndex(x=>x[0]===id);$('#stateCount').textContent=(i+1)+' / '+states.length;$('#stateNote').textContent=states[i][2];render();if(id==='closed')closePalette();
}
// Runnable in the browser console: check all deterministic previews without changing stored data.
window.checkDesignStates=()=>{const checks=[];for(const [id] of states){preview(id);if(id!=='closed'){const frame=$('#window'),footer=$('.footer');if(!footer)throw Error(id+': missing actions');if(!['book-empty','history-empty','no-results'].includes(id)&&!frame.classList.contains('floating'))throw Error(id+': expected toolbar');if(footer.getBoundingClientRect().bottom>frame.getBoundingClientRect().bottom+1)throw Error(id+': clipped actions')}checks.push(id)}preview('result');return checks};
$('#scenario').onchange=()=>toast('已切换演示场景，重新处理文本即可体验');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(s&&s.toString().trim()&&$('#result')?.contains(s.anchorNode))selectedText=s.toString()});document.addEventListener('keydown',e=>{if(e.altKey&&['KeyT','KeyP','KeyR'].includes(e.code)){e.preventDefault();navigate({KeyT:'translate',KeyP:'polish',KeyR:'direct'}[e.code])}if(e.key==='Escape'){closePalette()}if(e.key==='Enter'&&!e.metaKey&&!e.shiftKey&&e.target.id==='input'&&!result){e.preventDefault();run(view==='direct')}if(e.key==='Enter'&&e.metaKey&&['translate','polish','direct'].includes(view)){e.preventDefault();replace()}});preview('result');
</script></body></html>
