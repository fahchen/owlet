name: Owlet
options:
  bundleIdPrefix: dev.fahchen
  # The app is written in Simplified Chinese, so that is the String Catalog's source language and the
  # fallback for a missing translation. English, Traditional Chinese and Japanese are translated there.
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
# Signing lives in an xcconfig so a machine with a certificate can override it locally.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
targets:
  Owlet:
    type: application
    platform: macOS
    sources:
      - path: Owlet
        excludes: [ModelPrompts.json]
      # A data file, not source: xcodegen only bundles known resource types, so the model prompts have
      # to be declared explicitly or the app would run with empty prompts.
      - path: Owlet/ModelPrompts.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fahchen.owlet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        # The version users and artifacts are named by. `scripts/prod-build.sh` reads
        # CFBundleShortVersionString from the built app, so these two are what turn a packaged name
        # from a commit hash into a version; bump them here, in one place, when releasing.
        MARKETING_VERSION: "0.2.0"
        # The build number: raise it for every artifact handed out under the same version, so it
        # restarts with a new version.
        CURRENT_PROJECT_VERSION: "1"
  OwletTests:
    type: bundle.unit-test
    platform: macOS
    sources: [OwletTests]
    dependencies:
      - target: Owlet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Owlet:
    build:
      targets:
        Owlet: all
    test:
      targets: [OwletTests]
